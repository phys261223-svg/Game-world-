        function startStairsPlay() {
            document.getElementById('stairs-menu-overlay').style.display = 'none';
            stairsPlaying = true;
            stairsFalling = false;
            window.removeEventListener('keydown', stairsKeyHandler);
            window.addEventListener('keydown', stairsKeyHandler);
            stairsLoop();
        }

        // 다시하기 버튼/스페이스바 클릭 시 캐릭터 선택 메뉴를 거치지 않고 바로 게임을 재시작
        function restartStairsGame() {
            config.game = 'stairs';
            gameActive = true;
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('timer').style.display = 'none';
            document.querySelector('.status-box').style.display = 'none';
            showScreen('screen-game');
            initStairsGame();
            startStairsPlay();
        }

        function addStair() {
            let lastDir = stairsPath[stairsPath.length-1];
            let nextDir = Math.random() < 0.5 ? lastDir : -lastDir;
            stairsPath.push(nextDir);

            let lastPos = stairPositions[stairPositions.length - 1];
            stairPositions.push({
                x: lastPos.x + nextDir * 60,
                y: lastPos.y - 35
            });
        }

        function triggerStairsFall() {
            if (stairsFalling) return;
            stairsFalling = true;
            stairsPlaying = false;
            playerFallY = 0;
            playerFallSpeed = -6;
            playerFallRot = 0;
            window.removeEventListener('keydown', stairsKeyHandler);
        }

        function stairsKeyHandler(e) {
            if(!gameActive || config.game !== 'stairs' || !stairsPlaying || stairsFalling) return;
            let key = e.key.toLowerCase();
            
            if(key === 'm' || key === 'x') {
                if(key === 'x') {
                    playerDir = -playerDir; 
                }
                
                let nextStairDir = stairsPath[playerStairIndex + 1];
                if(playerDir === nextStairDir) {
                    stairsScore++;
                    playerStairIndex++;
                    stairsGauge = Math.min(100, stairsGauge + 8); 
                    
                    if(stairsPath.length - playerStairIndex < 30) addStair();

                    stairStepScale = 1.3;
                    let pPos = stairPositions[playerStairIndex];
                    let px = pPos.x + 30;
                    let py = pPos.y;

                    stairFloatingTexts.push({
                        x: px,
                        y: py - 20,
                        text: "+1",
                        alpha: 1.0,
                        vy: -2
                    });

                    for (let i = 0; i < 10; i++) {
                        let angle = Math.random() * Math.PI * 2;
                        let speed = Math.random() * 4 + 2;
                        stairParticles.push({
                            x: px,
                            y: py,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            color: `hsl(${Math.random() * 360}, 100%, 70%)`,
                            size: Math.random() * 3 + 2,
                            alpha: 1.0
                        });
                    }
                } else {
                    triggerStairsFall();
                }
            }
        }

        function renderStairsFrame() {
            if (config.game !== 'stairs') return;
            
            if (stairsPlaying && !stairsFalling) {
                stairsGauge -= 0.35 + (stairsScore * 0.005);
                if (stairsGauge <= 0) {
                    stairsGauge = 0;
                    triggerStairsFall();
                }
            }

            if (stairsFalling) {
                playerFallSpeed += 0.8;
                playerFallY += playerFallSpeed;
                playerFallRot += playerDir * 0.15;
                if (playerFallY > canvas.height + 100) {
                    stairsLastFinalScore = stairsScore;
                    endGame("게임 오버", `계단에서 추락했습니다!<br>최종 점수: ${stairsScore}점`);
                    return;
                }
            }

            let conceptIndex = Math.floor(stairsScore / 50) % stairConcepts.length;
            let concept = stairConcepts[conceptIndex];

            let pPos = stairPositions[playerStairIndex] || { x: 0, y: 0 };
            let camX = canvas.width / 2 - pPos.x - 30;
            let camY = canvas.height * 0.65 - pPos.y;

            ctx.save();
            concept.bgDraw(ctx, canvas.width, canvas.height, 0);

            ctx.translate(camX, camY);

            // 계단 그리기
            for (let i = Math.max(0, playerStairIndex - 15); i < Math.min(stairPositions.length, playerStairIndex + 30); i++) {
                let pos = stairPositions[i];
                ctx.fillStyle = concept.topColor;
                ctx.fillRect(pos.x, pos.y, 60, 12);
                ctx.fillStyle = concept.sideColor;
                ctx.fillRect(pos.x, pos.y + 12, 60, 18);
                ctx.strokeStyle = concept.strokeColor;
                ctx.lineWidth = 2;
                ctx.strokeRect(pos.x, pos.y, 60, 30);
            }

            // 파티클
            for (let i = stairParticles.length - 1; i >= 0; i--) {
                let p = stairParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) { stairParticles.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // 점수 플로팅 텍스트
            for (let i = stairFloatingTexts.length - 1; i >= 0; i--) {
                let t = stairFloatingTexts[i];
                t.y += t.vy;
                t.alpha -= 0.025;
                if (t.alpha <= 0) { stairFloatingTexts.splice(i, 1); continue; }
                ctx.save();
                ctx.globalAlpha = Math.max(0, t.alpha);
                ctx.fillStyle = '#fef08a';
                ctx.font = 'bold 20px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t.text, t.x, t.y);
                ctx.restore();
            }

            // 캐릭터 그리기 (시선/방향 표시)
            let skin = stairsSkins[stairsCharIndex];
            let charX = pPos.x + 30;
            let charY = pPos.y + playerFallY;

            ctx.save();
            ctx.translate(charX, charY);
            if (stairsFalling) {
                ctx.rotate(playerFallRot);
            }

            stairStepScale = Math.max(1, stairStepScale - 0.05);
            ctx.scale(1, stairStepScale);

            // 몸통
            ctx.fillStyle = skin.body;
            ctx.beginPath();
            ctx.roundRect(-14, -30, 28, 30, 6);
            ctx.fill();

            // 머리
            ctx.fillStyle = skin.head;
            ctx.beginPath();
            ctx.arc(0, -42, 16, 0, Math.PI * 2);
            ctx.fill();

            // 헤어밴드
            ctx.fillStyle = skin.band;
            ctx.fillRect(-16, -48, 32, 6);

            // 시선 방향 (playerDir: 1 = 오른쪽, -1 = 왼쪽)
            let eyeOffsetX = playerDir * 7;
            
            // 눈
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(eyeOffsetX, -43, 3.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 눈반사
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(eyeOffsetX + playerDir * 1, -44.5, 1.2, 0, Math.PI * 2);
            ctx.fill();

            // 코/돌출부 (바라보는 방향)
            ctx.fillStyle = skin.body;
            ctx.beginPath();
            ctx.moveTo(eyeOffsetX, -40);
            ctx.lineTo(eyeOffsetX + playerDir * 6, -38);
            ctx.lineTo(eyeOffsetX, -36);
            ctx.closePath();
            ctx.fill();

            // 머리 위 시선 표시 화살표
            ctx.fillStyle = '#fbbf24';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(playerDir * 10, -66);
            ctx.lineTo(playerDir * 22, -61);
            ctx.lineTo(playerDir * 10, -56);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
            ctx.restore();

            // 게이지 및 점수 UI
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 90, 20, 180, 50, 25);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 24px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`점수: ${stairsScore}`, canvas.width / 2, 45);

            let barW = Math.min(canvas.width * 0.7, 400);
            let barX = (canvas.width - barW) / 2;
            let barY = 85;

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.roundRect(barX, barY, barW, 16, 8);
            ctx.fill();

            let fillW = (stairsGauge / 100) * barW;
            if (fillW > 0) {
                let gaugeGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
                gaugeGrad.addColorStop(0, '#ef4444');
                gaugeGrad.addColorStop(0.5, '#f59e0b');
                gaugeGrad.addColorStop(1, '#10b981');
                ctx.fillStyle = gaugeGrad;
                ctx.beginPath();
                ctx.roundRect(barX, barY, fillW, 16, 8);
                ctx.fill();
            }

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barW, 16);
        }

        function stairsLoop() {
            if (!gameActive || config.game !== 'stairs') return;
            stairsAnimId = requestAnimationFrame(stairsLoop);
            renderStairsFrame();
        }
    </script>
</body>
